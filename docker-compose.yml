services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailpilot
      POSTGRES_PASSWORD: mailpilot
      POSTGRES_DB: mailpilot
    ports:
      - "5432:5432"
    volumes:
      - mailpilot_db:/var/lib/postgresql/data

volumes:
  mailpilot_db:
